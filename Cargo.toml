[package]
name = "polymarket-rs"
version = "0.1.0"
edition = "2021"
description = "A conservative Rust runtime for Polymarket paper trading and fail-closed live execution"
license = "MIT"
repository = "https://github.com/hitrich/polymarket-watch-rust"
readme = "README.md"
publish = false

[lib]
name = "polymarket_rs"
path = "src/lib.rs"

[[bin]]
name = "polymarket-rs"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
alloy = { version = "1.8.3", default-features = false, features = ["signer-local", "signers"] }
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
fs2 = "0.4"
futures-util = "0.3"
polymarket_client_sdk_v2 = { version = "=0.6.0", default-features = false, features = ["clob", "ws", "data", "tracing"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
